{% extends 'base.html' %}
{% block title %}My Account{% endblock %}
{% block content %}
<section class="container section">
  <h1 class="page-title">My account</h1>
  <div class="panel">
    <dl class="details">
      <dt>Name</dt><dd>{{ user.get_full_name|default:"-" }}</dd>
      <dt>Username</dt><dd>{{ user.username }}</dd>
      <dt>Email</dt><dd>{{ user.email|default:"-" }}</dd>
      <dt>Orders placed</dt><dd>{{ order_count }}</dd>
    </dl>
    <a class="btn btn-primary" href="{% url 'my_orders' %}">View my orders</a>
  </div>
</section>
{% endblock %}
